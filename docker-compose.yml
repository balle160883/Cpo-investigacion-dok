services:
  backend:
    build: ./backend
    ports:
      - "4002:4000"
    restart: always
    volumes:
      - investigacion_uploads:/app/uploads
    environment:
      - PORT=4000
      - DB_HOST=${DB_HOST:-31.97.144.6}
      - DB_PORT=${DB_PORT:-5437}
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:-Seguridad2028@}
      - DB_NAME=${DB_NAME:-postgres}
      - JWT_SECRET=${JWT_SECRET:-cpo-secret-2026}

  frontend:
    build:
      context: ./frontend
      args:
        - VITE_MAPBOX_TOKEN=${VITE_MAPBOX_TOKEN}
    ports:
      - "3002:80"
    restart: always
    depends_on:
      - backend

  # Servicio de Backup Automático de PostgreSQL (interno - sin S3 ni servicios externos)
  # Ejecuta pg_dump cada día a las 2:00 AM y guarda los archivos en el volumen local investigacion_backups
  # Mantiene los últimos 30 respaldos, eliminando los más antiguos automáticamente
  db-backup:
    image: postgres:15-alpine
    restart: always
    volumes:
      - investigacion_backups:/backups
    environment:
      - PGPASSWORD=${DB_PASSWORD:-Seguridad2028@}
    entrypoint: >
      sh -c "
        while true; do
          FECHA=$$(date +%Y-%m-%d_%H-%M-%S);
          ARCHIVO=/backups/cpo_investigacion_$$FECHA.sql.gz;
          echo \"[BACKUP] Iniciando respaldo: $$ARCHIVO\";
          pg_dump -h ${DB_HOST:-31.97.144.6} -p ${DB_PORT:-5437} -U ${DB_USER:-postgres} -d ${DB_NAME:-postgres} | gzip > $$ARCHIVO;
          echo \"[BACKUP] Respaldo completado: $$(du -sh $$ARCHIVO | cut -f1)\";
          find /backups -name '*.sql.gz' -mtime +30 -delete;
          echo \"[BACKUP] Limpieza completada. Archivos actuales: $$(ls /backups | wc -l)\";
          sleep 86400;
        done
      "

volumes:
  investigacion_uploads:
    name: investigacion_uploads
  investigacion_backups:
    name: investigacion_backups
