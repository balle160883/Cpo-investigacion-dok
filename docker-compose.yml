services:
  backend:
    build: ./backend
    ports:
      - "4002:4000"
    restart: always
    environment:
      - PORT=4000
      - DB_HOST=${DB_HOST:-31.97.144.6}
      - DB_PORT=${DB_PORT:-5437}
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:-Seguridad2028@}
      - DB_NAME=${DB_NAME:-postgres}
      - JWT_SECRET=${JWT_SECRET:-cpo-secret-2026}

  frontend:
    build:
      context: ./frontend
      args:
        - VITE_MAPBOX_TOKEN=${VITE_MAPBOX_TOKEN}
    ports:
      - "3002:80"
    restart: always
    depends_on:
      - backend
